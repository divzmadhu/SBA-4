<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    Hello & Welcome!!
    <h1>TaskMate - Task Management App </h1>

    <input id="taskName" type="text" placeholder="Enter a task name" />

    <input id="taskCategory" type="text" placeholder="Enter task category" />

    <input id="taskDeadline" type="date" />

    <select id="taskStatus">
        <option value="">Select status</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
        <option value="Overdue">Overdue</option>
    </select>

    <button id="addTaskButton">Add Task</button>
    <button id="displayTaskButton">Display Task</button>
    <button id ="updateStatusButton"> Update Status</button>
    <!-- <div id="taskList"></div> -->
     <ol id ="taskList"></ol>
     
    <button id="removeTaskButton">Remove Last Task</button>
    <ul id="taskList1"></ul>
</body>

</html>
