<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    Hello & Welcome!!
    <h1>TaskMate - Task Management App </h1>

    <input id="taskName" type="text" placeholder="Enter a task name" />

    <select id="taskCategory">
        <option value="">Select category</option>
        <option value="School">School</option>
        <option value="Personal">Personal</option>
        <option value="Work">Work</option>
    </select>

    <!-- <input id="taskCategory" type="text" placeholder="Enter task category" /> -->

    <input id="taskDeadline" type="date" />

    <select id="taskStatus">
        <option value="">Select status</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
        <option value="Overdue">Overdue</option>
    </select>

    <button id="addTaskButton">Add Task</button>
    <button id="displayTaskButton">Display Task</button>
    <button id="updateStatusButton"> Update Status</button>




   
    <h2>Filter Tasks</h2>

    <label for="statusFilter">Filter by Status:</label>

    <select id="statusFilter">
        <option value="All">All</option>       
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
        <option value="Overdue">Overdue</option>
    </select>



    <label for="categoryFilter">Filter by Category:</label>

    <select id="categoryFilter">
        <option value="All">All Categories</option>
        <option value="School">School</option>
        <option value="Personal">Personal</option>
        <option value="Work">Work</option>
    </select>


    <!-- <input type="text" id="categoryFilter" placeholder="Enter category"> -->

    <button id="filterButton">Filter Tasks</button>


    <!-- Display tasks -->
    <div id="taskList"></div>

    <!-- <div id="taskList"></div>
    <ol id="taskList"></ol> -->

    <button id="removeTaskButton">Remove Last Task</button>
    <ul id="taskList1"></ul>
</body>

</html>
